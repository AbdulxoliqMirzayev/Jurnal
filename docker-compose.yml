services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iron_trade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs

volumes:
  postgres_data:
